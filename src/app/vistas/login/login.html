<section class="izq">
  <h1>Iniciar Sesión</h1>
  <p class="sub">Ingresa con tu usuario</p>
  <label class="campo"><span>👤</span><input placeholder="Usuario" [(ngModel)]="usuario" (keyup.enter)="entrar()" /></label>
  <label class="campo"><span>🔒</span><input type="password" placeholder="Contraseña" [(ngModel)]="clave" (keyup.enter)="entrar()" /></label>
  @if (error()) { <p class="error">Usuario o contraseña incorrectos.</p> }
  <a class="olvido" href="#" (click)="$event.preventDefault()">¿Olvidaste tu contraseña?</a>
  <div class="botones">
    <button class="entrar" (click)="entrar()">INICIAR SESIÓN</button>
    <button class="reg">REGISTRAR</button>
  </div>
</section>

<section class="der">
  <img class="logo" src="img/logo1.png" alt="Natural" />
  <div class="garrafon">
    <span class="cap">Capacidad actual</span>
    <img src="img/nivel-inicio.png" alt="Garrafón" />
  </div>
  <p class="pie">Sistema de Gestión<br /><strong>Purificadora Natural</strong></p>
</section>
